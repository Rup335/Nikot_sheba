<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | NikotSheba</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar" id="navbar"></header>

<main class="container">
    <div id="alert-box"></div>
    <div class="card form-card">
        <h1>Login</h1>
        <form id="login-form">
            <label>Email</label>
            <input type="email" id="email" required>
            <label>Password</label>
            <input type="password" id="password" required>
            <button class="btn" type="submit">Login</button>
        </form>
        <p class="muted" style="margin-top:14px;">No account? <a href="register.html">Register here</a></p>
        <div class="demo-box">
            <strong>Demo accounts</strong><br>
            Admin: admind@example.com / admin123<br>
            Provider: rahim@example.com / 123456<br>
            Customer: amit@example.com / 123456
        </div>
    </div>
</main>

<footer class="footer" id="footer"></footer>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
