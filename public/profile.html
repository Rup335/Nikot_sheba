<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | ServiceHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar" id="navbar"></header>

<main class="container">
    <div id="alert-box"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));">
        <div class="card">
            <h2 style="margin-top:0;">Account details</h2>
            <form id="profile-form">
                <label>Email (cannot be changed)</label>
                <input type="text" id="email" disabled>
                <label>Account type</label>
                <input type="text" id="role" disabled>
                <label>Full name</label>
                <input type="text" id="name" required>
                <label>Phone</label>
                <input type="text" id="phone" required>
                <button class="btn" type="submit" style="width:100%;margin-top:16px;">Save changes</button>
            </form>
        </div>
        <div class="card">
            <h2 style="margin-top:0;">Change password</h2>
            <form id="password-form">
                <label>Current password</label>
                <input type="password" id="current" required>
                <label>New password</label>
                <input type="password" id="new" minlength="6" required>
                <button class="btn" type="submit" style="width:100%;margin-top:16px;">Change password</button>
            </form>
        </div>
    </div>
</main>

<footer class="footer" id="footer"></footer>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
